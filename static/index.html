<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Forum</title>
    <meta name="theme-color" content="#ffffff">
    <!-- Apply the saved (or system) theme before the first paint, so there's no white flash -->
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) {}
            var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = dark ? "dark" : "light";
            document.querySelector('meta[name="theme-color"]').content = dark ? "#000000" : "#ffffff";
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Icon sprite: each <symbol> is reused with <svg><use href="#id"></svg> -->
    <svg class="sprite" aria-hidden="true">
        <symbol id="icon-logo" viewBox="0 0 24 24">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.6 3.8A.9.9 0 0 1 5 19.1V16h-.5A.5.5 0 0 1 4 15.5z" fill="currentColor"/>
            <path d="M13.2 6.2 9.4 10.4h2.7l-1.3 3.4 3.8-4.2h-2.7z" style="fill: var(--surface)"/>
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24">
            <path d="M14 4.5H6.5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1H14M10.5 12h10m-3.5-3.5L20.5 12 17 15.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-home" viewBox="0 0 24 24">
            <path d="M3.5 10.2 12 3.5l8.5 6.7V20a.5.5 0 0 1-.5.5h-5.5v-6h-5v6H4a.5.5 0 0 1-.5-.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <path d="m3.8 6.5 8.2 6 8.2-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-profile" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-search" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <path d="m15.5 15.5 5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-reply" viewBox="0 0 24 24">
            <path d="M4 11.5C4 7.4 7.6 4.5 12 4.5s8 2.9 8 7-3.6 7-8 7c-.9 0-1.8-.1-2.6-.4L5 20l1.2-3.6A6.6 6.6 0 0 1 4 11.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-more" viewBox="0 0 24 24">
            <circle cx="5.5" cy="12" r="1.6" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
            <circle cx="18.5" cy="12" r="1.6" fill="currentColor"/>
        </symbol>
        <symbol id="icon-back" viewBox="0 0 24 24">
            <path d="M20 12H5m6-6.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-send" viewBox="0 0 24 24">
            <path d="M4 12 20 4l-4.5 16-3.7-6.3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
            <path d="m11.8 13.7 3.6-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-feather" viewBox="0 0 24 24">
            <path d="M20 4c-7 0-12 4.5-13.5 12.5L5 20m2-3.5h6.5C17 16.5 20 11 20 4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
    </svg>

    <!-- Signed-out screen -->
    <div id="auth-view" class="auth" hidden>
        <button type="button" class="icon-button auth-theme theme-toggle" aria-pressed="false" aria-label="Dark mode">
            <svg><use href="#icon-moon"></use></svg>
        </button>
        <div class="auth-brand" aria-hidden="true">
            <svg class="auth-brand-mark"><use href="#icon-logo"></use></svg>
        </div>
        <div class="auth-panel">
            <svg class="auth-small-mark" aria-hidden="true"><use href="#icon-logo"></use></svg>
            <h1 class="auth-title">Happening now</h1>
            <h2 class="auth-subtitle" id="auth-heading">Sign in to Real-Time Forum</h2>

            <form id="login-form" class="auth-form">
                <input type="text" id="login" placeholder="Nickname or email" autocomplete="username" required>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" class="btn btn-dark btn-wide">Sign in</button>
                <p class="form-status" id="login-message" role="status"></p>
                <p class="auth-switch">Don't have an account? <button type="button" class="link-button" data-auth="register">Create account</button></p>
            </form>

            <form id="register-form" class="auth-form" hidden>
                <div class="field-row">
                    <input type="text" id="first-name" placeholder="First name" autocomplete="given-name" required>
                    <input type="text" id="last-name" placeholder="Last name" autocomplete="family-name" required>
                </div>
                <input type="text" id="nickname" placeholder="Nickname" autocomplete="nickname" required>
                <input type="email" id="email" placeholder="Email" autocomplete="email" required>
                <div class="field-row">
                    <input type="number" id="age" placeholder="Age" min="1" required>
                    <input type="text" id="gender" placeholder="Gender" required>
                </div>
                <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" required>
                <button type="submit" class="btn btn-accent btn-wide">Create account</button>
                <p class="form-status" id="register-message" role="status"></p>
                <p class="auth-switch">Already have an account? <button type="button" class="link-button" data-auth="login">Sign in</button></p>
            </form>
        </div>
    </div>

    <!-- Signed-in screen: sidebar | timeline | right column -->
    <div id="app-view" class="shell" hidden>
        <header class="sidebar">
            <div class="sidebar-inner">
                <button type="button" class="logo-button" data-view="home" aria-label="Real-Time Forum home">
                    <svg><use href="#icon-logo"></use></svg>
                </button>
                <nav class="side-nav" aria-label="Main">
                    <button type="button" class="nav-item" data-view="home">
                        <svg><use href="#icon-home"></use></svg><span>Home</span>
                    </button>
                    <button type="button" class="nav-item" data-action="open-chat">
                        <svg><use href="#icon-chat"></use></svg><span>Chat</span>
                        <span class="nav-badge" id="chat-badge" hidden></span>
                    </button>
                    <button type="button" class="nav-item" data-view="profile">
                        <svg><use href="#icon-profile"></use></svg><span>Profile</span>
                    </button>
                    <button type="button" class="nav-item theme-toggle" aria-pressed="false">
                        <svg><use href="#icon-moon"></use></svg><span>Dark mode</span>
                    </button>
                    <button type="button" class="nav-item nav-logout" id="nav-logout-button">
                        <svg><use href="#icon-logout"></use></svg><span>Log out</span>
                    </button>
                </nav>
                <button type="button" class="btn btn-dark btn-post" id="sidebar-post-button">
                    <span class="btn-post-label">Post</span>
                    <svg class="btn-post-icon" aria-hidden="true"><use href="#icon-feather"></use></svg>
                </button>

                <div class="account">
                    <button type="button" class="account-button" id="account-button" aria-haspopup="menu" aria-expanded="false">
                        <span class="avatar" id="account-avatar"></span>
                        <span class="account-names">
                            <strong id="account-name"></strong>
                            <span id="account-handle"></span>
                        </span>
                        <svg class="account-more"><use href="#icon-more"></use></svg>
                    </button>
                    <div class="account-menu" id="account-menu" role="menu" hidden>
                        <button type="button" role="menuitem" id="logout-button">Log out <span id="logout-handle"></span></button>
                    </div>
                </div>
            </div>
        </header>

        <main class="timeline" id="timeline">
            <!-- Home view -->
            <section id="home-view">
                <div class="timeline-header">
                    <div class="tabs" id="category-tabs" role="tablist" aria-label="Filter by category"></div>
                </div>

                <form id="post-form" class="composer">
                    <span class="avatar" id="composer-avatar"></span>
                    <div class="composer-body">
                        <input type="text" id="post-title" class="composer-title" placeholder="Title" maxlength="200" required>
                        <textarea id="post-content" class="composer-content" placeholder="What's happening?" rows="1" required></textarea>
                        <input type="text" id="post-categories" class="composer-categories" placeholder="Categories, separated by commas" required>
                        <div class="composer-footer">
                            <p class="form-status" id="post-message" role="status"></p>
                            <button type="submit" class="btn btn-dark" id="post-submit" disabled>Post</button>
                        </div>
                    </div>
                </form>

                <div id="post-list" class="feed" aria-live="polite"></div>
            </section>

            <!-- Profile view -->
            <section id="profile-view" hidden>
                <div class="timeline-header page-header">
                    <button type="button" class="icon-button" data-view="home" aria-label="Back to home">
                        <svg><use href="#icon-back"></use></svg>
                    </button>
                    <div>
                        <h1 id="profile-title"></h1>
                        <p id="profile-count"></p>
                    </div>
                </div>
                <div class="profile-banner"></div>
                <div class="profile-card">
                    <span class="avatar avatar-xl" id="profile-avatar"></span>
                    <h2 id="profile-name"></h2>
                    <p class="muted" id="profile-handle"></p>
                    <ul class="profile-facts" id="profile-facts"></ul>
                </div>
                <h3 class="section-label">Posts</h3>
                <div id="profile-post-list" class="feed"></div>
            </section>
        </main>

        <aside class="rightbar">
            <div class="rightbar-inner">
                <label class="search">
                    <svg><use href="#icon-search"></use></svg>
                    <input type="search" id="search-input" placeholder="Search posts">
                </label>

                <section class="card" aria-labelledby="chats-heading">
                    <div class="card-heading">
                        <h2 class="card-title" id="chats-heading">Chats</h2>
                        <span class="online-count" id="online-count"></span>
                    </div>
                    <div id="side-user-list" class="user-list">Loading users...</div>
                </section>

                <section class="card">
                    <h2 class="card-title">Categories</h2>
                    <div id="side-category-list" class="trend-list"></div>
                </section>
            </div>
        </aside>
    </div>

    <!-- Floating chat drawer, like X's messages drawer -->
    <section id="chat-drawer" class="chat-drawer" aria-label="Chat" hidden>
        <header class="chat-drawer-header">
            <button type="button" class="icon-button" id="chat-back" aria-label="Back to chats" hidden>
                <svg><use href="#icon-back"></use></svg>
            </button>
            <div class="chat-drawer-titles">
                <h2 id="chat-title">Chats</h2>
                <p id="chat-subtitle"></p>
            </div>
            <button type="button" class="icon-button" id="chat-close" aria-label="Close chat">
                <svg><use href="#icon-close"></use></svg>
            </button>
        </header>

        <div id="chat-user-list" class="user-list drawer-user-list"></div>

        <div id="chat-conversation" class="chat-conversation" hidden>
            <div id="chat-message-list" class="chat-message-list" aria-live="polite"></div>
            <p id="typing-status" class="typing-status"></p>
            <p id="message-status" class="form-status"></p>
            <form id="message-form" class="message-form">
                <textarea id="message-content" placeholder="Start a new message" rows="1" required></textarea>
                <button type="submit" class="icon-button send-button" aria-label="Send message">
                    <svg><use href="#icon-send"></use></svg>
                </button>
            </form>
        </div>
    </section>

    <button type="button" class="chat-fab" id="chat-fab" aria-label="Open chat" hidden>
        <svg><use href="#icon-chat"></use></svg>
        <span class="fab-dot" id="chat-fab-dot" hidden></span>
    </button>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
