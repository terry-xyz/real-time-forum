<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-Time Forum</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section id="auth-view" class="auth-view">
        <div class="auth-panel">
          <h1>Real-Time Forum</h1>
          <div class="tabs">
            <button id="show-login" class="active" type="button">Login</button>
            <button id="show-register" type="button">Register</button>
          </div>
          <form id="login-form" class="form">
            <label>Nickname or email <input name="identifier" autocomplete="username" required></label>
            <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Login</button>
          </form>
          <form id="register-form" class="form hidden">
            <label>Nickname <input name="nickname" required></label>
            <label>Age <input name="age" type="number" min="1" required></label>
            <label>Gender
              <select name="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </label>
            <label>First name <input name="first_name" required></label>
            <label>Last name <input name="last_name" required></label>
            <label>Email <input name="email" type="email" autocomplete="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]+" title="Use an email like name@example.com" required></label>
            <label>Password <input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
            <button type="submit">Register</button>
          </form>
          <p id="auth-error" class="error"></p>
        </div>
      </section>

      <section id="app-view" class="app-view hidden">
        <header class="topbar">
          <strong>Real-Time Forum</strong>
          <div>
            <span id="current-user"></span>
            <button id="logout" type="button">Logout</button>
          </div>
        </header>

        <div class="layout">
          <aside class="chat-sidebar">
            <h2>Messages</h2>
            <ul id="user-list" class="user-list"></ul>
          </aside>

          <section class="feed">
            <form id="post-form" class="post-form">
              <input name="title" placeholder="Post title" required>
              <textarea name="content" placeholder="What do you want to share?" required></textarea>
              <div id="category-list" class="category-list"></div>
              <p id="post-error" class="error"></p>
              <button type="submit">Create post</button>
            </form>
            <div id="posts"></div>
          </section>

          <aside class="chat-panel">
            <header>
              <h2 id="chat-title">Select a user</h2>
            </header>
            <div id="messages" class="messages"></div>
            <form id="message-form" class="message-form">
              <input name="content" placeholder="Private message" disabled autocomplete="off">
              <button type="submit" disabled>Send</button>
            </form>
          </aside>
        </div>
      </section>
    </main>
    <script src="/static/app.js?v=post-error-1"></script>
  </body>
</html>
